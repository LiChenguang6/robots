name: Build Redmi K50 Wake APK
on:
  push:
    branches: [k50-wake-apk-build]
    paths:
      - 'k50-wake/**'
      - '.github/workflows/build-k50-wake.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android client
        run: |
          mkdir -p workspace
          base64 -d k50-wake/packed-source.b64 | tar -xJf - -C workspace
          test -f workspace/android_k50_wake/app/build.gradle
      - name: Build debug APK
        working-directory: workspace/android_k50_wake
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Show APK SHA256
        run: sha256sum workspace/android_k50_wake/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K50-QQ-Wake-debug-APK
          path: workspace/android_k50_wake/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
